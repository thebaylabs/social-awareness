<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Annakut Darshan · 3D view</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <!-- No web fonts: the host site makes no request to any other website,
         so the text here uses the fonts already on the visitor's device. -->
    <link rel="stylesheet" href="vendor/supersplat-viewer/viewer.css" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Lets the viewer find its engine without a build step. -->
    <script type="importmap">
      {
        "imports": {
          "playcanvas": "./vendor/playcanvas/build/playcanvas.min.mjs",
          "playcanvas/": "./vendor/playcanvas/",
          "@playcanvas/supersplat-viewer/viewer": "./vendor/supersplat-viewer/viewer.js",
          "@playcanvas/supersplat-viewer/settings": "./vendor/supersplat-viewer/settings.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- The 3D scene. The viewer builds its canvas inside this element. -->
    <div id="viewer" role="application" aria-label="3D scene"></div>

    <!-- Hotspot buttons, positioned over the scene every frame. -->
    <div id="markers"></div>

    <header class="topbar">
      <h1 id="site-title">Annakut Darshan</h1>
      <div class="topbar-actions">
        <button id="reset" class="chip" type="button">Reset view</button>
        <button id="lang" class="chip lang" type="button" aria-label="Switch language">
          <span data-lang="en">EN</span><span data-lang="gu">ગુજ</span>
        </button>
      </div>
    </header>

    <p id="hint" class="hint" hidden></p>

    <!-- Walk along the display: a start button, then the step controls.
         Shown only for a scene whose description has a "walk". -->
    <div id="walk" class="walk" hidden>
      <button id="walk-start" class="walk-btn primary" type="button"></button>
      <div id="walk-steps" class="walk-steps" hidden>
        <button id="walk-next" class="walk-btn primary" type="button"></button>
        <span id="walk-count" class="walk-count"></span>
        <button id="walk-back" class="walk-btn round" type="button">›</button>
        <button id="walk-exit" class="walk-btn" type="button"></button>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="loading-box">
        <p id="loading-label">Loading 3D scene…</p>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <!-- Info sheet: slides up from the bottom on phones, sits on the right on wide screens. -->
    <aside id="sheet" class="sheet" aria-hidden="true">
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Close">×</button>
      <div class="sheet-scroll">
        <img id="sheet-image" class="sheet-image" alt="" />
        <div class="sheet-text">
          <h2 id="sheet-title"></h2>
          <p id="sheet-subtitle" class="sheet-subtitle"></p>
          <p id="sheet-body" class="sheet-body"></p>
        </div>
      </div>
      <nav class="sheet-nav">
        <button id="prev" class="nav-btn" type="button">‹ <span id="prev-label">Previous</span></button>
        <span id="counter" class="counter"></span>
        <button id="next" class="nav-btn" type="button"><span id="next-label">Next</span> ›</button>
      </nav>
    </aside>

    <footer class="footer">
      <button id="debug" class="debug" type="button" title="Tap to change quality"></button>
      <a id="credit" class="credit" target="_blank" rel="noopener"></a>
    </footer>

    <div id="error" class="error" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
